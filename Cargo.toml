[workspace]
resolver = "2"
members = ["crates/*", "apps/axiomata/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "fs", "io-util", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
home = "0.5"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
gray_matter = "0.3"
ignore = "0.4"
regex = "1"
globset = "0.4"
# Cron expression parser. Native format is 6-7 fields (seconds required),
# not the 5-field crontab format. Deliberately not `tokio-cron-scheduler`:
# routine firing state has to survive restarts, so Axiomata owns the poll
# loop and persists `next_fire_at` itself (see `routines::scheduler`).
cron = "0.17"
# HTTP client for `axiomata-opencode`, which talks to Opencode 2's local
# background service (plain HTTP on the loopback, so no TLS stack). Already in
# the tree through `ollama-rs`; no extra features — the event stream is read
# chunk by chunk (`Response::chunk`), JSON goes through `serde_json`.
reqwest = { version = "0.12", default-features = false }
# Only ever talks to a local Ollama daemon over plain HTTP, so the default
# native-tls stack (and, on macOS, the Security.framework link) is dead weight.
# Add `features = ["rustls"]` if a remote HTTPS endpoint is ever needed.
ollama-rs = { version = "0.3", default-features = false }
# Encodes an image's raw bytes for `workspace::read_image` (inlined into the
# Markdown viewer as a `data:` URI — see that function's doc comment for why
# not `asset://`).
base64 = "0.22"
# PTY spawning for the `axiomata-terminal` engine crate (from the wezterm
# project, also used by e.g. Zed). Rolling our own openpty/fork/exec would
# teach little about *terminals* specifically and is a real unsafe-syscall
# footgun — see docs/plans/terminal.md's technology-choice table.
portable-pty = "0.9"
# ANSI/VT100 escape-sequence parser for the `axiomata-terminal` engine crate
# (Checkpoint 2) — the same crate Alacritty uses. Tokenizing escape
# sequences is fiddly and error-prone but teaches little about terminal
# *behavior*; what a parsed event does to the screen model is all our own
# code. Default features only (`std`) — no `ansi`/`serde` support needed.
vte = "0.15"
# Display width (1/2 cells) of a Unicode scalar value, for the screen grid's
# CJK/emoji handling (Checkpoint 2) — a lookup-table problem with no
# terminal-specific insight to gain from reimplementing it.
unicode-width = "0.2"
# `openat`/`renameat`/`unlinkat` for `axiomata-files`: every action walks from
# the root's directory fd with `O_NOFOLLOW`, so a directory swapped for a
# symlink between the guard's check and the action cannot redirect it (the
# TOCTOU the ED0.1 security audit found). Safe wrappers — no own `unsafe`.
# Already in the tree transitively; `fs` is the only module needed.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# File-change events for `axiomata-files`' watcher (editor plan E5) —
# FSEvents on macOS. What an event *means* (modified/deleted/created, judged
# by content version after a debounce) is our own code in `watch.rs`.
notify = "8"
# Content hash of a project's `tasks.json` for `axiomata-tasks`: the owner confirms what a file runs, and the
# confirmation holds only for exactly that content. SHA-256, so a changed file cannot be made to match.
sha2 = "0.10"
# Random bytes for the per-start session secret of an agent's MCP server (`axiomata-ide::session_token`): the OS's
# generator, no seeding of our own. Already in the tree transitively.
getrandom = "0.3"
