[package]
name = "axiomata-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The Kanban board core. Core owns the migration chain and the connection and
# hands both to the board crate; the dependency deliberately points this way
# only, so `axiomata-ide` can use the board later without pulling core in.
axiomata-board = { path = "../axiomata-board" }
axiomata-ide = { path = "../axiomata-ide" }
axiomata-roster = { path = "../axiomata-roster" }
axiomata-tasks = { path = "../axiomata-tasks" }
axiomata-opencode = { path = "../axiomata-opencode" }
# The guarded file service (editor plan ED0); `workspace` is its strict root.
axiomata-files = { path = "../axiomata-files" }
# The own agent harness (`docs/plans/harness.md`): `backend: axh` runs a skill through it (HS6b). The allowed
# dependency direction — the harness knows nothing of core (H2).
axiomata-harness = { path = "../axiomata-harness" }
home.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
gray_matter.workspace = true
ollama-rs.workspace = true
# The providers' model catalogs (board card #17): OpenRouter's public list over HTTPS, Ollama's on the loopback.
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
ignore.workspace = true
cron.workspace = true
# Kills the process group of a `claude -p` run that outlives its limit, MCP servers and shell children included;
# `fs` for reading a Glut session's spec without following a link (`glut_card`).
rustix = { workspace = true, features = ["process", "fs"] }

[dev-dependencies]
# Only the workspace tests decode images now; encoding moved to axiomata-files.
base64.workspace = true
# The fake model server of the `backend: axh` end-to-end test listens on the loopback (HS6b).
tokio = { workspace = true, features = ["net"] }
