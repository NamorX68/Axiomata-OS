[package]
name = "axiomata-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The Kanban board core. Core owns the migration chain and the connection and
# hands both to the board crate; the dependency deliberately points this way
# only, so `axiomata-ide` can use the board later without pulling core in.
axiomata-board = { path = "../axiomata-board" }
axiomata-ide = { path = "../axiomata-ide" }
home.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
gray_matter.workspace = true
ollama-rs.workspace = true
ignore.workspace = true
cron.workspace = true
base64.workspace = true
