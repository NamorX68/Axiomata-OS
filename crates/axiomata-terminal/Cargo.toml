[package]
name = "axiomata-terminal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone PTY + terminal-emulation engine — no Tauri/axiomata-core dependency, embeddable in Axiomata-OS's dashboard or run on its own."

[dependencies]
portable-pty.workspace = true
vte.workspace = true
unicode-width.workspace = true
# `Cell`/`Color` derive `Serialize` (Checkpoint 3) so the Tauri glue layer
# can send them straight over IPC instead of hand-rolling a parallel DTO —
# a plain derive, not a step back on the "no Tauri/axiomata-core" rule.
serde.workspace = true

[[bin]]
name = "term-poc"
path = "src/bin/term-poc.rs"
