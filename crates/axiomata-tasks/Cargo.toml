description = "Run/Tasks of the Studio (docs/plans/editor-projekt-werkzeuge.md, #50): which tasks a project offers (detected from Cargo.toml, package.json, pyproject; written in tasks.json), the owner's confirmation of a project file by content hash, and the shell line a task runs as. Pure — no Tauri, no database, no macOS-only code."

