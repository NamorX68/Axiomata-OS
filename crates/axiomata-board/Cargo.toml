[package]
name = "axiomata-board"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone Kanban board core — no Tauri/axiomata-core dependency. Owns neither the database file nor the connection: every operation takes a `&Connection`, so the same crate can back the dashboard module, the CLI, and (later) the agentic IDE's task board without any of them depending on each other."

[dependencies]
rusqlite.workspace = true
serde.workspace = true
# Card labels are stored as a JSON array in one TEXT column rather than a join
# table: a board is a few hundred rows, and filtering happens in Rust/TS anyway.
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
