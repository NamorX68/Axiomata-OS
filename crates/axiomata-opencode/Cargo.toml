[package]
name = "axiomata-opencode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Client for Opencode 2's local background service — sessions, prompts, the event stream. No Tauri/axiomata-core dependency, so the skill runner and the agentic IDE can both use it."

[dependencies]
reqwest.workspace = true
# `getuid` for the discovery file's owner check (already in the tree via axiomata-files).
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
