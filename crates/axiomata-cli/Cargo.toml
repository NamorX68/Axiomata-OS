[package]
name = "axiomata-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
chrono.workspace = true
axiomata-core = { path = "../axiomata-core" }
axiomata-git = { path = "../axiomata-git" }
glut.workspace = true
axiomata-files.workspace = true
axiomata-roster = { path = "../axiomata-roster" }
rusqlite.workspace = true
anyhow.workspace = true
clap.workspace = true
# `signal`: `harness run` ends a run cleanly on Ctrl-C.
tokio = { workspace = true, features = ["signal"] }
tracing-subscriber.workspace = true
# `inbox move` walks and links through folder handles (`openat`/`linkat`), so no folder can turn into a link midway.
rustix.workspace = true
