[package]
name = "Axiomata-OS"
version = "0.1.0"
description = "Axiomata-OS desktop shell"
authors = ["Roman Thimian"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "axiomata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# The native open dialog for the file app (editor plan E6). Driven from Rust
# only — `capabilities/default.json` deliberately grants none of its JS API.
tauri-plugin-dialog = "2"
# The macOS notification when an agent starts waiting for the owner (`waiting_watch.rs`, plans/agent-waiting.md W6).
# Called from Rust only — `capabilities/default.json` grants none of its JS API.
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
home.workspace = true
# The vault watch for the Orbit's live ember and agent sparks (`vault_watch.rs`, ui-ux-round G9).
notify.workspace = true
# `O_NOFOLLOW` for reading the stored background image (`wallpaper.rs`); already the workspace's own file-flag crate.
rustix.workspace = true
axiomata-core = { path = "../../../crates/axiomata-core" }
axiomata-terminal = { path = "../../../crates/axiomata-terminal" }
axiomata-files.workspace = true
axiomata-git = { path = "../../../crates/axiomata-git" }
axiomata-tasks = { path = "../../../crates/axiomata-tasks" }
axiomata-roster = { path = "../../../crates/axiomata-roster" }
axiomata-dap = { path = "../../../crates/axiomata-dap" }
axiomata-macos = { path = "../../../crates/axiomata-macos" }
# The owner's local date and time of a recurring event, resolved to an instant for EventKit (board card #77).
chrono.workspace = true
rusqlite.workspace = true

