<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axiomata-OS</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Axiomata-OS — Skills</h1>
      <p class="hint">
        Minimal M1 placeholder UI. The real dashboard (module canvas) comes
        later.
      </p>

      <section>
        <h2>Skills</h2>
        <p id="skills-status" class="status"></p>
        <table id="skills-table" hidden>
          <thead>
            <tr>
              <th>Name</th>
              <th>Backend</th>
              <th>Description</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="skills-body"></tbody>
        </table>
      </section>

      <section>
        <h2>Recent runs</h2>
        <p id="runs-status" class="status"></p>
        <table id="runs-table" hidden>
          <thead>
            <tr>
              <th>#</th>
              <th>Started</th>
              <th>Status</th>
              <th>Skill</th>
              <th>Backend</th>
              <th>ms</th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
